name: arm64

# Guests on arm64: the images and test binaries built on a hosted arm64
# runner, then the integration tests on hyperlight-dev's self-hosted arm64
# runners (Linux/KVM, macOS/Hypervisor.framework and Windows/WHP), which
# hosted runners cannot stand in for.  Those runners are few and shared
# with hyperlight, so this is tiers 2 and 3 of docs/ci.md:
#
# - Tier 2, on pull requests labelled ci/arm64: macOS and Windows.  Only
#   maintainers can label, and Dependabot labels the updates that can break
#   an arm64 host or guest (dependabot.yml).  ci-passed waits for this run
#   on those already labelled when ci-passed starts.  A pull request from a
#   fork runs when it is labelled, not on its later pushes: remove and re-add
#   the label to test new commits.  That keeps honest runs deliberate; it is
#   no security boundary, since a fork's pull request brings its own copy of
#   this file.  Outside code is kept off the runners by the setting that
#   requires approval before a fork's workflows run.
# - Tier 3, nightly on main, blocking nothing: all three hosts, Linux
#   included.  Its runner is a small VM (2 CPUs, 3 GB) whose guests run
#   under nested virtualization, where a guest's first touch of each page is
#   slow: there the agent, Java, node, .NET JIT and PowerShell suites, and
#   the agent benchmarks, take hours (agent's about 30 times as long as on
#   the Mac), so they run on Sundays' run only.  ci-report.yml re-runs a
#   failed nightly once, then files what still fails as issues.
#
# A push to main tests nothing, as the next nightly run does.  Its run only
# refreshes the guest images' cache, on a hosted runner, so that the pull
# requests after it need not build them.  Started by hand, it is a nightly
# run of the branch; `weekly` adds Sunday's suites.
on:
  workflow_dispatch:
    inputs:
      weekly:
        description: "Sunday's suites too: Linux's slow ones and its agent benchmarks"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  # One job, calling arm64-jobs.yml, which has the others: a run this skips
  # shows one skipped check, not one per job.  On a pull request labelled
  # ci/arm64: when that label is added, or on a push to a branch of this
  # repository (not a fork's), and not when some other label is added.
  arm64:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci/arm64') &&
       (github.event.action == 'labeled' && github.event.label.name == 'ci/arm64' ||
        github.event.action != 'labeled' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    uses: ./.github/workflows/arm64-jobs.yml
    with:
      weekly: ${{ inputs.weekly || false }}
    # The most the called jobs (arm64-jobs.yml) may ask for
    permissions:
      actions: read     # the plan job: this run's start
      contents: write   # the bench jobs: push to gh-pages
