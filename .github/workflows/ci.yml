name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Lint ──────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # v1 namespaces the cache. hyperlight-host's Windows RustEmbed asset
          # (hyperlight_surrogate.exe under target/*/build/hls) is a build-script
          # side-effect the cache can't reliably keep, so it's regenerated by
          # rebuilding that crate on the Windows jobs instead of cached here.
          prefix-key: "v1-rust"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: License headers
        run: ./dev/check-license-headers.sh

  # ── arm64 hosts: build, lint and unit tests ─────────────────
  # macOS (Hypervisor.framework), Linux and Windows arm64 build different
  # cfg paths (the arm64 kernel, BSD sockets and errno, WHP on arm64).
  # Hosted runners can run no guest there (no HVF, no /dev/kvm, no nested
  # Hyper-V), so only what needs no VM runs; arm64.yml boots the guests
  # on macOS, Linux and Windows.
  lint-arm64:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # Windows builds hyperlight-host's surrogate too, and links slower.
    timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 40 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v1-rust"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # As in the test job: the cache can lose hyperlight-host's surrogate.
      - name: Rebuild hyperlight-host on Windows (regenerate the RustEmbed surrogate)
        if: runner.os == 'Windows'
        run: cargo clean -p hyperlight-host

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --lib --locked

  # ── Spell check ──────────────────────────────────────────────
  typos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  # ── Kernel verify ────────────────────────────────────────────
  kernel-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Verify kernel builds from source
        run: just verify-kernel

      - name: Verify native fixture kernel builds from source
        run: just verify-native-kernel

  # ── Guest images (Linux only, shared by every test job) ──────
  # Rootfs images, the conformance image and the compiled test binaries
  # are all Linux build products (Docker + cpio, Linux toolchains).  This
  # job builds them once into a cache keyed on their inputs, and every
  # test job on every OS restores that cache.
  rootfs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Cache key
        id: key
        run: echo "key=rootfs-${{ hashFiles('rust-toolchain.toml', 'drivers/**', 'conformance/python/**', 'examples/agent/custom/Dockerfile', 'examples/c/**', 'examples/rust/**', 'examples/go/**', 'examples/wasmtime/**', 'examples/dotnet-aot/**', 'examples/autonomous/**', 'examples/http-server/**', 'examples/agent-framework/local.Dockerfile', 'demos/pptx-gen/Dockerfile.rootfs') }}" >> "$GITHUB_OUTPUT"

      - name: Cache guest images and test binaries
        id: rootfs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-elfloader
          key: ${{ steps.key.outputs.key }}
          # Saved on Linux, restored on Windows too.
          enableCrossOsArchive: true

      - name: Install cpio
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends cpio

      - name: Install .NET SDK
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Install Go
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: false

      - name: Build rootfs images, conformance image and test binaries
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          just build-all-rootfs
          just build-conformance python
          just build-test-bins
          just build-demos

  # ── Test ──────────────────────────────────────────────────────
  test:
    name: test (${{ matrix.os }})
    needs: rootfs
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # v1 namespaces the cache. hyperlight-host's Windows RustEmbed asset
          # (hyperlight_surrogate.exe under target/*/build/hls) is a build-script
          # side-effect the cache can't reliably keep, so it's regenerated by
          # rebuilding that crate on the Windows jobs instead of cached here.
          prefix-key: "v1-rust"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Restore guest images and test binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-elfloader
          key: ${{ needs.rootfs.outputs.cache-key }}
          # Saved on Linux, restored on Windows too.
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Rebuild hyperlight-host on Windows (regenerate the RustEmbed surrogate)
        # hyperlight-host embeds hyperlight_surrogate.exe via RustEmbed at compile
        # time; the rust-cache can prune that build-script output, leaving a cached
        # restore without it. Rebuild just this crate on Windows so build.rs
        # regenerates the asset (Windows-only: the surrogate build is Windows-only).
        if: runner.os == 'Windows'
        run: |
          cargo clean -p hyperlight-host
          cargo clean -p hyperlight-host --release

      # The x64 Windows code paths only compile here; lint them here too.
      - name: cargo clippy
        if: runner.os == 'Windows'
        run: cargo clippy --all-targets --locked -- -D warnings

      # `just test` sets the WHP surrogate pool and thread count on Windows.
      - name: cargo test
        run: just test --locked

  # ── Static Linux binaries ───────────────────────────────────
  # The Linux release and dev binaries are static musl builds (release.yml,
  # dev.yml), which the other jobs never compile.  Build both here, and
  # boot a guest with the x86_64 one, where the hosted runner has KVM.
  static-linux:
    name: static-linux (${{ matrix.target }})
    needs: rootfs
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v1-rust"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: musl toolchain
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          # The pinned toolchain first: `target add` installing it by itself
          # is deprecated in rustup.
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Build hluk (static)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Static, and runs
        run: |
          bin=target/${{ matrix.target }}/release/hluk
          file "$bin" | grep -Eq 'static(ally|-pie) linked' || { file "$bin"; exit 1; }
          "$bin" --version

      - name: Restore guest images
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-elfloader
          key: ${{ needs.rootfs.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Enable KVM
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot a guest
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          target/${{ matrix.target }}/release/hluk run \
            --initrd build-elfloader/python-rootfs.cpio examples/python/hello.py

  # ── Demos ──────────────────────────────────────────────────────
  # End-to-end demo/example runs the integration tests don't cover (in-guest
  # HTTP servers, the autonomous appliance, pptx generation, a local agent, the
  # supply-chain containment demo).  The guest rootfs come from the cache the
  # `rootfs` job built; `just demos` runs ci/run_demo.py, the same runner on
  # both OSes.  One job per (os, demo) so failures are isolated.
  demos:
    name: demos (${{ matrix.os }}, ${{ matrix.demo }})
    needs: rootfs
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
        demo: [supply-chain, autonomous, http-flask, http-express, http-kestrel, pptx, agent-fw-local]
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v1-rust"
          save-if: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # ci/run_demo.py is the cross-platform runner; pin a Python for it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore guest images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-elfloader
          key: ${{ needs.rootfs.outputs.cache-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Rebuild hyperlight-host on Windows (regenerate the RustEmbed surrogate)
        # hyperlight-host embeds hyperlight_surrogate.exe via RustEmbed at compile
        # time; the rust-cache can prune that build-script output, leaving a cached
        # restore without it. Rebuild just this crate on Windows so build.rs
        # regenerates the asset (Windows-only: the surrogate build is Windows-only).
        if: runner.os == 'Windows'
        run: |
          cargo clean -p hyperlight-host
          cargo clean -p hyperlight-host --release

      - name: Run demo
        run: just demos ${{ matrix.demo }}

  # ── Integrations ───────────────────────────────────────────
  # The Python packages in integrations/, smolagents-hyperlight (smolagents)
  # and mcp-server-hyperlight (mcp), with this commit's hluk and agent image,
  # their micro-VM tests included, against the oldest release of the library
  # each builds on and the newest. The MCP server runs its guest through
  # this commit's smolagents-hyperlight.
  integrations:
    name: ${{ matrix.package }} (${{ matrix.os }}, ${{ matrix.deps }} ${{ matrix.package }}, Python ${{ matrix.python }})
    needs: rootfs
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # By their directories under integrations/, rather than their PyPI
        # names, as every step runs in one
        package: [smolagents, mcp]
        os: [linux, windows]
        deps: [oldest, newest]
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          # The libraries each package builds on, tested at the floors its
          # pyproject.toml gives them on the oldest leg
          - package: smolagents
            floors: smolagents
          - package: mcp
            floors: mcp smolagents-hyperlight smolagents anyio pydantic rich
          # This commit's smolagents-hyperlight, which the MCP server runs its
          # guest through; the oldest leg has the release it allows from PyPI
          - package: mcp
            deps: newest
            requires: -e ../smolagents
          # The oldest library on the oldest Python the package allows
          - deps: oldest
            python: "3.10"
          - deps: newest
            python: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v1-rust"
          # The key names the job, so only this job's own saves restore here
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Restore guest images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-elfloader
          key: ${{ needs.rootfs.outputs.cache-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Rebuild hyperlight-host on Windows (regenerate the RustEmbed surrogate)
        # As in the test job: a cached build can lack hyperlight_surrogate.exe.
        if: runner.os == 'Windows'
        run: cargo clean -p hyperlight-host --release

      - name: Build hluk
        run: cargo build --release --locked

      - name: Install the package
        working-directory: integrations/${{ matrix.package }}
        env:
          FLOORS: ${{ matrix.floors }}
        run: |
          python -m pip install ${{ matrix.requires }} -e '.[test]'
          if [ "${{ matrix.deps }}" = oldest ]; then
            pins=
            for library in $FLOORS; do
              oldest=$(sed -n "s/.*\"$library>=\([0-9.]*\),.*/\1/p" pyproject.toml)
              if [ -z "$oldest" ]; then
                echo "::error::pyproject.toml gives $library no floor"
                exit 1
              fi
              pins="$pins $library==$oldest"
            done
            python -m pip install $pins
          fi
          for library in $FLOORS; do
            echo "$library $(python -m pip show "$library" | sed -n 's/^Version: //p')"
          done

      - name: Lint
        if: matrix.os == 'linux' && matrix.deps == 'newest'
        working-directory: integrations/${{ matrix.package }}
        # Pinned, so that a new ruff release fails no commit that did not change
        run: |
          python -m pip install ruff==0.17.1
          ruff check . && ruff format --check .

      # The Desktop Extension as pypi-publish.yml packs it, validated here, where nothing is published
      - name: Validate the Desktop Extension
        if: matrix.package == 'mcp' && matrix.os == 'linux' && matrix.deps == 'newest'
        working-directory: integrations/mcp
        # Pinned, as ruff is
        run: |
          python pack_mcpb.py "$RUNNER_TEMP/hyperlight.mcpb"
          # One command a line: bash -e stops at a failing one, but not at one inside an && list
          mkdir "$RUNNER_TEMP/mcpb"
          cd "$RUNNER_TEMP/mcpb"
          unzip -q ../hyperlight.mcpb
          # What the uv server type runs: its entry point, and the project that names the server to install
          for file in icon.png src/server.py pyproject.toml; do
            test -f "$file" || { echo "::error::The packed extension lacks $file"; exit 1; }
          done
          npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json

      - name: Test
        working-directory: integrations/${{ matrix.package }}
        env:
          RUN_ALL: "1"
          HLUK_PATH: ${{ github.workspace }}/target/release/hluk${{ runner.os == 'Windows' && '.exe' || '' }}
          HLUK_INITRD: ${{ github.workspace }}/build-elfloader/agent-rootfs.cpio
          HLUK_SCRATCH_MB: "1536"
        run: python -m pytest -v

  # ── ClickHouse integration ─────────────────────────────────
  # integrations/clickhouse (the HyperlightPython UDF driver) with this
  # commit's kernel and python image, against a ClickHouse server of a
  # pinned release: its tests boot guests, and one starts the server.
  clickhouse:
    needs: rootfs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      # A release with driver-based UDFs, pinned by digest like the images
      CLICKHOUSE_VERSION: 26.9.22.3
      CLICKHOUSE_SHA512: 095a868ab34d739d55c303bfff47c806344a84592650b27316aa51a5790f22e03d3bb23df6dcb48d7c21011c2be7723183ab61773a1db345329c269f3e1cdb49
    defaults:
      run:
        working-directory: integrations/clickhouse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v1-rust"
          workspaces: integrations/clickhouse
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore guest images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-elfloader
          key: ${{ needs.rootfs.outputs.cache-key }}
          # As the rootfs job saves it: the flag is part of the cache's version
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Download ClickHouse
        run: |
          tarball="clickhouse-common-static-$CLICKHOUSE_VERSION-amd64.tgz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/ClickHouse/ClickHouse/releases/download/v$CLICKHOUSE_VERSION-stable/$tarball"
          echo "$CLICKHOUSE_SHA512  $RUNNER_TEMP/$tarball" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "CLICKHOUSE_BINARY=$RUNNER_TEMP/clickhouse-common-static-$CLICKHOUSE_VERSION/usr/bin/clickhouse" >> "$GITHUB_ENV"

      - name: cargo fmt
        run: cargo fmt -- --check

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Lint the guest's Python
        # Pinned as the integrations job pins it, so that a new ruff release fails no commit that did not change
        run: |
          python -m pip install ruff==0.17.1
          ruff check src/guest.py && ruff format --check src/guest.py

      # Not --locked: the lock follows the root crate, a path dependency,
      # whose own changes would leave it stale
      - name: cargo clippy
        # In the profile the tests build, so that they share one build
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Test
        env:
          CLICKHOUSE_HYPERLIGHT_INITRD: ${{ github.workspace }}/build-elfloader/python-rootfs.cpio
        run: cargo test --release

  # ── Conformance ──────────────────────────────────────────────
  conformance:
    name: conformance (${{ matrix.os }})
    needs: rootfs
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # v1 namespaces the cache. hyperlight-host's Windows RustEmbed asset
          # (hyperlight_surrogate.exe under target/*/build/hls) is a build-script
          # side-effect the cache can't reliably keep, so it's regenerated by
          # rebuilding that crate on the Windows jobs instead of cached here.
          prefix-key: "v1-rust"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Restore guest images and test binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-elfloader
          key: ${{ needs.rootfs.outputs.cache-key }}
          # Saved on Linux, restored on Windows too.
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Rebuild hyperlight-host on Windows (regenerate the RustEmbed surrogate)
        # hyperlight-host embeds hyperlight_surrogate.exe via RustEmbed at compile
        # time; the rust-cache can prune that build-script output, leaving a cached
        # restore without it. Rebuild just this crate on Windows so build.rs
        # regenerates the asset (Windows-only: the surrogate build is Windows-only).
        if: runner.os == 'Windows'
        run: |
          cargo clean -p hyperlight-host
          cargo clean -p hyperlight-host --release

      - name: Run CPython conformance suite
        shell: bash
        run: |
          just conformance python 2>&1 | tee conformance-output.txt

      - name: Post conformance summary
        if: always()
        shell: bash
        run: |
          if [ -f conformance-output.txt ]; then
            echo '## CPython Conformance Results (${{ matrix.os }})' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            summary=$(grep '^SUMMARY ' conformance-output.txt || echo "no summary")
            echo "**${summary}**" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            # List any non-PASS results
            fails=$(grep '^RESULT ' conformance-output.txt | grep -v 'status=PASS' || true)
            if [ -n "$fails" ]; then
              echo '### Non-passing modules' >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$fails" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  # ── Benchmarks ───────────────────────────────────────────────
  bench:
    name: "bench (${{ matrix.os }}, ${{ matrix.runtime }}) — check results ↗"
    needs: rootfs
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write   # push to gh-pages
    # 25 of them for the gate's second measurement (benchmarks/gate.sh).
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
        runtime: [python, python-shell, agent]
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
        # agent is the slow one (~20 min on Windows); python-shell covers the
        # same paths on PRs, agent's history is kept from pushes to main.
        exclude:
          - runtime: ${{ github.event_name == 'pull_request' && 'agent' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # v1 namespaces the cache. hyperlight-host's Windows RustEmbed asset
          # (hyperlight_surrogate.exe under target/*/build/hls) is a build-script
          # side-effect the cache can't reliably keep, so it's regenerated by
          # rebuilding that crate on the Windows jobs instead of cached here.
          prefix-key: "v1-rust"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Restore guest images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-elfloader
          key: ${{ needs.rootfs.outputs.cache-key }}
          # Saved on Linux, restored on Windows too.
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Rebuild hyperlight-host on Windows (regenerate the RustEmbed surrogate)
        # hyperlight-host embeds hyperlight_surrogate.exe via RustEmbed at compile
        # time; the rust-cache can prune that build-script output, leaving a cached
        # restore without it. Rebuild just this crate on Windows so build.rs
        # regenerates the asset (Windows-only: the surrogate build is Windows-only).
        if: runner.os == 'Windows'
        run: |
          cargo clean -p hyperlight-host
          cargo clean -p hyperlight-host --release

      - name: Run benchmarks
        id: bench
        shell: bash
        run: just bench ${{ matrix.runtime }}

      # The gate: benchmarks/gate.sh, which measures a timing over its
      # ceiling again before it fails on it. A hang in that second run times
      # out this step rather than the job, so Store still charts the first.
      - name: Check ceilings
        shell: bash
        timeout-minutes: 25
        env:
          RUNTIME: ${{ matrix.runtime }}
          HOST: ${{ matrix.os }}
        run: bash benchmarks/gate.sh "$RUNTIME" "$HOST"

      # Also after a failed "Check ceilings" (its summary table is the
      # diagnosis), but not after a failed or cancelled bench: there is no
      # results file then, and the ENOENT here would hide the real failure.
      - name: Store benchmark results
        if: ${{ !cancelled() && steps.bench.outcome == 'success' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: ${{ matrix.runtime }} benchmarks
          tool: customSmallerIsBetter
          output-file-path: bench-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # One history per host OS; the two are not comparable.
          benchmark-data-dir-path: dev/bench/${{ matrix.os }}/${{ matrix.runtime }}
          # Push to gh-pages only on main merges (not on PRs)
          auto-push: ${{ github.event_name == 'push' }}
          # The job summary: one current/previous/ratio table per job,
          # "previous" being the last result pushed from main.  Ratios only warn: the
          # hosted runners vary by 10-30% (Linux) to 2x (Windows) between
          # runs of the same commit.  The gate is "Check ceilings" above.
          summary-always: true
          fail-on-alert: false
          alert-threshold: '200%'
          comment-on-alert: false

  # ── Gate ──────────────────────────────────────────────────────
  ci-passed:
    if: always()
    needs: [lint, lint-arm64, typos, kernel-verify, rootfs, test, static-linux, demos, integrations, clickhouse, conformance, bench]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
    steps:
      - name: Verify all jobs passed
        run: |
          jq --exit-status 'all(.result == "success")' \
            <<< '${{ toJson(needs) }}'

      # A pull request labelled ci/arm64 also needs its arm64 run to pass. The
      # labels are read once, when this step starts: a label added later gates
      # nothing until the job is re-run. The run that counts is the latest
      # started (a re-run restarts one) for the commit that did not skip (runs
      # for other labels, for a fork's pushes, or from before the label skip
      # everything); one awaiting approval, then one cancelled, counts only
      # when no other does. It is done here, not as a job in arm64.yml,
      # because the newest check of a name is the one that counts, and a
      # skipped run's would pass.
      - name: Wait for the arm64 run
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          for try in 1 2 3; do
            labels=$(gh pr view "$PR" --json labels -q '.labels[].name') && break
            [ "$try" -lt 3 ] || { echo "::error::Reading the labels failed."; exit 1; }
            sleep 20
          done
          if ! grep -qx ci/arm64 <<< "$labels"; then
            echo "Not labelled ci/arm64: no arm64 run needed."
            exit 0
          fi
          rerun="then re-run this job (re-running arm64 alone leaves it failed)"
          [ "$FORK" = true ] && no_run_limit=600 || no_run_limit=1800
          started=$SECONDS
          failures=0
          while :; do
            # Not push: main's runs of the commit, once it is merged, get
            # cancelled by later pushes. A run started by hand counts.
            if run=$(gh api "repos/$GH_REPO/actions/workflows/arm64.yml/runs?head_sha=$SHA&per_page=100" \
                       -q '[.workflow_runs[] | select(.event != "push" and .conclusion != "skipped")]
                           | sort_by([(.conclusion | if . == "cancelled" then 0 elif . == "action_required" then 1 else 2 end),
                                      .run_started_at, .id])
                           | last // empty
                           | "\(.status) \(.conclusion // "none") \(.html_url)"'); then
              failures=0
              if [ -n "$run" ]; then
                read -r status conclusion url <<< "$run"
                case "$status $conclusion" in
                  "completed success") echo "arm64 run passed: $url"; exit 0 ;;
                  "completed action_required") echo "Waiting for the arm64 run's approval: $url" ;;
                  "completed startup_failure")
                    echo "::error::arm64.yml did not start, $url: fix the workflow file."
                    exit 1 ;;
                  completed*)
                    echo "::error::arm64 run: $conclusion, $url. Re-run it, $rerun."
                    exit 1 ;;
                  *) echo "Waiting for the arm64 run ($status): $url" ;;
                esac
                # Closed unmerged only: a merged one's check should still
                # say what arm64 found.
                if [ "$(gh pr view "$PR" --json state -q .state || echo OPEN)" = CLOSED ]; then
                  echo "The pull request is closed: no arm64 run needed."
                  exit 0
                fi
              elif [ $((SECONDS - started)) -gt "$no_run_limit" ]; then
                # A fork's pull request runs arm64 when labelled, not on its
                # later pushes (see arm64.yml), so soon there will be none;
                # one of this repository's always gets a run, if late.
                echo "::error::No arm64 run tests $SHA: remove and re-add the ci/arm64 label, $rerun."
                exit 1
              else
                echo "No arm64 run for $SHA yet."
              fi
            else
              # API errors are retried, for over an hour in a row, so that a
              # spent rate limit can reset.
              failures=$((failures + 1))
              if [ "$failures" -ge 35 ]; then
                echo "::error::Listing the arm64 runs failed $failures times in a row."
                exit 1
              fi
              echo "::warning::Listing the arm64 runs failed; trying again."
            fi
            # Just short of the job's 360 minutes, so that the message says
            # what to do.
            if [ $((SECONDS - started)) -gt $((350 * 60)) ]; then
              echo "::error::Gave up waiting for the arm64 run: re-run this job once it passes."
              exit 1
            fi
            sleep 120
          done
