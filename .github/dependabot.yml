# Grouped version updates once a month, each group one pull request across
# its directories. Outside the wasmtime group, a cargo major comes on its
# own, one per directory; an action major on its own, across its
# directories. Anything that has to move in step with something Dependabot
# cannot see is left out and bumped by hand. Cargo, pip and action security
# updates still come, listed directories or not (pip's to
# integrations/mcp/mcpb and the templates too); Docker has none. The updates
# that can break an arm64 host or guest are labelled ci/arm64 too, so that
# tier 2 of docs/ci.md runs on them and ci-passed waits for it: the main
# crate's (Hyperlight among them) and the guest-side wasmtime crates, one
# entry that Dependabot cannot split, the Rust toolchain and the images'
# bases, the kernel's included. The rest, the actions, ClickHouse's crates
# and the Python integrations' libraries, get tier 1, and the nightly run
# tests them on arm64 once merged.
version: 2
updates:
  - package-ecosystem: cargo
    # Each has its own Cargo.lock: there is no workspace. demos/pptx-gen is
    # left out: CI does not build it.
    directories:
      - /
      - /drivers/wasmtime/driver
      - /examples/wasmtime/calculator
      - /examples/wasmtime/hello-p3
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels: [dependencies, ci/arm64]
    groups:
      # wasmtime and wasmtime-wasi share a version, wasmparser and wat
      # follow it, and the guest crates target the WASI it runs.
      wasmtime:
        patterns: [wasmtime, wasmtime-*, wasmparser, wat, wit-bindgen, wasip3]
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # A new Hyperlight is a port, host and kernel together (see #142).
      - dependency-name: hyperlight-*
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Apart from the others, without ci/arm64: it is tested on Linux alone,
  # and tier 2 has no Linux host; the nightly run tests it on Linux arm64.
  - package-ecosystem: cargo
    directory: /integrations/clickhouse
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: hyperlight-*
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The Python integrations, libraries whose ranges CI tests at both ends
  # (the integrations job's oldest and newest legs): widened, never raised,
  # so a new major past a cap comes as a pull request and the floors stay.
  # Without ci/arm64, as tier 2 would run all of itself for them: a release
  # with no arm64 wheel shows in the nightly run.
  - package-ecosystem: pip
    directories:
      - /integrations/mcp
      - /integrations/smolagents
      - /integrations/verl
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    versioning-strategy: widen
    labels: [dependencies]
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Moves with the ruff CI pins (ci.yml), by hand
      - dependency-name: ruff

  # rust-toolchain.toml, which drivers/wasmtime's image follows (just
  # build-rootfs passes it the channel): a new compiler can break any host's
  # build, an arm64 one's included, and gains clippy lints.
  # No cooldown: Dependabot knows no toolchain's release date.  A pull
  # request opened on a release's day may find no rust image for it on
  # Docker Hub yet: re-run it a day later.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci/arm64]

  - package-ecosystem: github-actions
    # / covers .github/workflows and a root action.yml, not the composite
    # actions under .github/actions: those are listed too.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
        # A new typos release brings new words to fix: on its own, so it
        # holds up no other action.
        exclude-patterns: [crate-ci/typos]
        update-types: [minor, patch]
      # One pull request per action across the workflows and the composite
      # actions, so that no merge leaves them on different majors.
      majors:
        patterns: ["*"]
        update-types: [major]
        group-by: dependency-name

  # Digest refreshes and patch releases only: a new minor or major tag
  # (python 3.13, alpine 3.21, dotnet 10) changes what a rootfs ships and
  # where (the python images copy /usr/local/lib/python3.12).
  - package-ecosystem: docker
    directories:
      - /conformance/python
      - /demos/pptx-gen
      - /drivers
      - /drivers/agent
      - /drivers/bash
      - /drivers/c
      - /drivers/dotnet-aot
      - /drivers/dotnet-jit
      - /drivers/go
      - /drivers/java
      - /drivers/node
      - /drivers/powershell
      - /drivers/python
      - /drivers/python-shell
      - /drivers/quickjs
      - /drivers/rust
      # Not drivers/wasmtime: it builds from the rust image of the release
      # rust-toolchain.toml pins, and moves with it.
      - /examples/agent-framework
      - /examples/agent/custom
      - /examples/http-server/express
      - /examples/http-server/flask
      - /examples/http-server/kestrel
      - /kernel
      - /templates/http-dotnet
      - /templates/http-node
      - /templates/http-python
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels: [dependencies, ci/arm64]
    groups:
      images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The amd64 image must stay the release the arm64 stage downloads
      # (PWSH_VERSION in drivers/powershell/Dockerfile).
      - dependency-name: powershell
      # Built locally by `just build-rootfs`, not pulled.
      - dependency-name: hluk-*
